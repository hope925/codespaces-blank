<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SIGNAL — local deck</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#180b12; --bg2:#2a111d; --card:#351524;
    --acid:#ff8fbd; --violet:#8e294f; --pink:#ff4f9a;
    --text:#fff1f6; --muted:#c08b9f; --line:#542338;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:radial-gradient(1200px 800px at 80% -10%, #5a1738 0%, var(--bg) 55%);
    color:var(--text); font-family:'JetBrains Mono',monospace;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .deck{
    width:min(980px,100%); background:var(--bg2); border:1px solid var(--line);
    border-radius:18px; display:grid; grid-template-columns:1.1fr 1fr; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  @media(max-width:760px){ .deck{grid-template-columns:1fr;} }

  /* LEFT: tracklist */
  .side{ padding:22px 20px; border-right:1px solid var(--line); }
  .brand{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; letter-spacing:.5px; }
  .brand span{ color:var(--acid); }
  .tag{ color:var(--muted); font-size:11px; margin:4px 0 18px; letter-spacing:1px; text-transform:uppercase; }

  .drop{
    border:1.5px dashed var(--line); border-radius:12px; padding:14px; text-align:center;
    font-size:12px; color:var(--muted); cursor:pointer; transition:.2s;
  }
  .drop:hover{ border-color:var(--acid); color:var(--acid); }
  input[type=file]{ display:none; }

  .search{
    width:100%; margin-top:14px; background:#200d17; border:1px solid var(--line);
    color:var(--text); border-radius:8px; padding:8px 10px; font-family:'JetBrains Mono',monospace;
    font-size:12px; outline:none;
  }
  .search:focus{ border-color:var(--acid); }
  .search::placeholder{ color:var(--muted); }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip{
    font-size:10px; letter-spacing:.4px; text-transform:uppercase; color:var(--muted);
    border:1px solid var(--line); padding:4px 9px; border-radius:20px; cursor:pointer;
  }
  .chip.on{ color:#2a111d; background:var(--acid); border-color:var(--acid); }

  .list{ margin-top:14px; max-height:250px; overflow-y:auto; }
  .track{
    display:flex; align-items:center; gap:8px; padding:9px 8px; border-radius:8px;
    cursor:pointer; font-size:13px; color:var(--muted);
  }
  .track:hover{ background:#421b2d; }
  .track.active{ color:var(--acid); background:#4b1b31; }
  .num{ font-size:11px; width:20px; opacity:.6; }
  .tname{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tgenre{
    font-size:10px; background:#200d17; color:var(--muted); border:1px solid var(--line);
    border-radius:6px; padding:2px 5px; font-family:'JetBrains Mono',monospace;
  }
  .tgenre:focus{ outline:none; border-color:var(--violet); color:var(--text); }

  /* RIGHT: player */
  .player{ padding:26px; display:flex; flex-direction:column; align-items:center; }

  .vinylwrap{ position:relative; width:200px; height:200px; margin-top:6px; }
  .vinyl{
    width:100%; height:100%; border-radius:50%;
    background:
      repeating-radial-gradient(circle at center, #14070d 0 3px, #35101f 3px 6px);
      border:6px solid #10050a; position:relative;
    animation:spin 3.2s linear infinite; animation-play-state:paused;
    box-shadow:0 0 40px rgba(255,79,154,.3);
  }
  .vinyl.spin{ animation-play-state:running; }
  .vinyl::after{
    content:""; position:absolute; inset:0; margin:auto; width:34px; height:34px; border-radius:50%;
    background:linear-gradient(135deg,var(--violet),var(--pink)); border:3px solid #180b12;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .now{ margin-top:18px; text-align:center; }
  .now .t{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; }
  .now .a{ color:var(--muted); font-size:12px; margin-top:2px; }

  canvas{ width:100%; height:64px; margin:16px 0 6px; }

  .seek{ width:100%; display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); }
  input[type=range]{
    -webkit-appearance:none; flex:1; height:4px; border-radius:4px; background:var(--line); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--acid); cursor:pointer;
    box-shadow:0 0 8px var(--acid);
  }

  .controls{ display:flex; align-items:center; gap:18px; margin-top:16px; }
  .controls button{
    background:none; border:none; color:var(--text); cursor:pointer; font-size:18px;
    width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    transition:.15s;
  }
  .controls button:hover{ background:#232833; }
  #play{
    width:56px; height:56px; font-size:22px; background:linear-gradient(135deg,var(--violet),var(--pink));
    color:#fff1f6; box-shadow:0 0 20px rgba(255,79,154,.4);
  }
  #play:hover{ background:linear-gradient(135deg,var(--violet),var(--pink)); filter:brightness(1.1); }

  .toggles{ display:flex; gap:10px; margin-top:14px; }
  .pill{
    font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--muted);
    border:1px solid var(--line); padding:5px 10px; border-radius:20px; cursor:pointer;
  }
  .pill.on{ color:var(--acid); border-color:var(--acid); }

  .empty{ color:var(--muted); font-size:12px; margin-top:10px; }
</style>
</head>
<body>

<div class="deck">
  <div class="side">
    <div class="brand">SIGNAL<span>.</span></div>
    <div class="tag">local playback — nothing leaves your machine</div>

    <label class="drop">
      + drop tracks / click to load audio files
      <input id="file" type="file" accept="audio/*" multiple>
    </label>

    <input class="search" id="search" type="text" placeholder="search title or genre...">
    <div class="chips" id="chips"></div>

    <div class="list" id="list"></div>
    <div class="empty" id="empty">no tracks loaded yet</div>
  </div>

  <div class="player">
    <div class="vinylwrap"><div class="vinyl" id="vinyl"></div></div>

    <div class="now">
      <div class="t" id="ttitle">nothing spinning</div>
      <div class="a" id="tsub">load a file to begin</div>
    </div>

    <canvas id="viz"></canvas>

    <div class="seek">
      <span id="cur">0:00</span>
      <input id="seek" type="range" min="0" max="100" value="0">
      <span id="dur">0:00</span>
    </div>

    <div class="controls">
      <button id="prev" title="previous">⏮</button>
      <button id="play" title="play">▶</button>
      <button id="next" title="next">⏭</button>
    </div>

    <div class="toggles">
      <div class="pill" id="shuffle">shuffle</div>
      <div class="pill" id="repeat">repeat</div>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
const fileInput = document.getElementById('file');
const list = document.getElementById('list');
const empty = document.getElementById('empty');
const audio = document.getElementById('audio');
const playBtn = document.getElementById('play');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const seek = document.getElementById('seek');
const cur = document.getElementById('cur');
const dur = document.getElementById('dur');
const ttitle = document.getElementById('ttitle');
const tsub = document.getElementById('tsub');
const vinyl = document.getElementById('vinyl');
const shuffleBtn = document.getElementById('shuffle');
const repeatBtn = document.getElementById('repeat');
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
const searchInput = document.getElementById('search');
const chipsEl = document.getElementById('chips');

const GENRES = ['Pop','Rock','Hip-Hop','Electronic','Jazz','Lo-fi','Classical','Other'];

let tracks = [];
let current = -1;
let shuffle = false, repeat = false;
let audioCtx, analyser, source, dataArray;
let activeGenre = 'All';
let query = '';

function fmt(t){
  if(isNaN(t)) return "0:00";
  const m = Math.floor(t/60), s = Math.floor(t%60);
  return m + ":" + String(s).padStart(2,'0');
}

fileInput.addEventListener('change', e=>{
  const files = Array.from(e.target.files);
  files.forEach(f=>{
    tracks.push({ name: f.name.replace(/\.[^/.]+$/,''), url: URL.createObjectURL(f), genre: 'Other' });
  });
  renderChips();
  renderList();
  if(current === -1 && tracks.length) loadTrack(indexOf(0));
});

function renderChips(){
  chipsEl.innerHTML = '';
  ['All', ...GENRES].forEach(g=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeGenre===g ? ' on' : '');
    chip.textContent = g;
    chip.onclick = ()=>{ activeGenre = g; renderChips(); renderList(); };
    chipsEl.appendChild(chip);
  });
}

function filtered(){
  return tracks
    .map((t,i)=>({...t, idx:i}))
    .filter(t=>{
      const matchesGenre = activeGenre==='All' || t.genre===activeGenre;
      const matchesQuery = !query || t.name.toLowerCase().includes(query) || t.genre.toLowerCase().includes(query);
      return matchesGenre && matchesQuery;
    });
}

function indexOf(fallback){
  const f = filtered();
  return f.length ? f[0].idx : fallback;
}

searchInput.addEventListener('input', e=>{
  query = e.target.value.trim().toLowerCase();
  renderList();
});

function renderList(){
  empty.style.display = tracks.length ? 'none' : 'block';
  const rows = filtered();
  empty.textContent = tracks.length ? 'no tracks match that search' : 'no tracks loaded yet';
  if(tracks.length) empty.style.display = rows.length ? 'none' : 'block';
  list.innerHTML = '';
  rows.forEach(t=>{
    const i = t.idx;
    const row = document.createElement('div');
    row.className = 'track' + (i===current ? ' active' : '');
    row.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span><span class="tname">${t.name}</span>`;
    row.onclick = ()=> loadTrack(i, true);

    const sel = document.createElement('select');
    sel.className = 'tgenre';
    GENRES.forEach(g=>{
      const opt = document.createElement('option');
      opt.value = g; opt.textContent = g;
      if(g===t.genre) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.onclick = e=> e.stopPropagation();
    sel.onchange = e=>{ tracks[i].genre = e.target.value; renderList(); };
    row.appendChild(sel);

    list.appendChild(row);
  });
}

function loadTrack(i, autoplay){
  current = i;
  audio.src = tracks[i].url;
  ttitle.textContent = tracks[i].name;
  tsub.textContent = `${tracks[i].genre} · track ${i+1} of ${tracks.length}`;
  renderList();
  if(autoplay) audio.play();
  setupViz();
}

function setupViz(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    source = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    draw();
  }
}

function draw(){
  requestAnimationFrame(draw);
  if(!analyser) return;
  analyser.getByteFrequencyData(dataArray);
  const w = canvas.width = canvas.clientWidth;
  const h = canvas.height = canvas.clientHeight;
  ctx.clearRect(0,0,w,h);
  const bw = w/dataArray.length;
  for(let i=0;i<dataArray.length;i++){
    const bh = (dataArray[i]/255)*h;
    const grad = ctx.createLinearGradient(0,h,0,h-bh);
    grad.addColorStop(0,'#8e294f'); grad.addColorStop(1,'#ff8fbd');
    ctx.fillStyle = grad;
    ctx.fillRect(i*bw, h-bh, bw-2, bh);
  }
}

playBtn.onclick = ()=>{
  if(!tracks.length) return;
  if(audio.paused){ audio.play(); } else { audio.pause(); }
};
audio.onplay = ()=>{ playBtn.textContent='⏸'; vinyl.classList.add('spin'); };
audio.onpause = ()=>{ playBtn.textContent='▶'; vinyl.classList.remove('spin'); };

nextBtn.onclick = ()=> step(1);
prevBtn.onclick = ()=> step(-1);
function step(dir){
  if(!tracks.length) return;
  let i;
  if(shuffle) i = Math.floor(Math.random()*tracks.length);
  else i = (current + dir + tracks.length) % tracks.length;
  loadTrack(i, true);
}

audio.onended = ()=>{
  if(repeat){ audio.currentTime = 0; audio.play(); }
  else step(1);
};

audio.ontimeupdate = ()=>{
  seek.value = (audio.currentTime / (audio.duration||1)) * 100;
  cur.textContent = fmt(audio.currentTime);
  dur.textContent = fmt(audio.duration);
};
seek.oninput = ()=>{ if(audio.duration) audio.currentTime = (seek.value/100)*audio.duration; };

shuffleBtn.onclick = ()=>{ shuffle=!shuffle; shuffleBtn.classList.toggle('on',shuffle); };
repeatBtn.onclick = ()=>{ repeat=!repeat; repeatBtn.classList.toggle('on',repeat); };

renderChips();
</script>
</body>
</html>
